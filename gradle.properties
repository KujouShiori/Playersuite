# ===== 构建相关 =====
# JDK 自带 cacerts 可能缺少 Google Trust Services(GTS WE1/R4) 根证书，
# 走代理下载依赖时会报 PKIX path building failed，这里改用 Windows 系统证书库。
org.gradle.jvmargs=-Xmx2G -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ===== Mod 元信息 =====
mod_id=playersuite
mod_name=玩家服务套件
mod_group_id=dev.mcmods
mod_version=1.0.1
mod_license=MIT
mod_description=玩家服务套件：仓库、邮件、银行、商店、市场、称号、签到，统一 GUI 入口。

# ===== 版本 =====
# Minecraft 与 NeoForge（1.21.1 对应 21.1.x 系列）
minecraft_version=1.21.1

# 版本以 https://maven.neoforged.net/releases/net/neoforged/neoforge/ 为准；
# 若该版本不可用，可换成同系列任意 21.1.x。
neo_version=21.1.230
# ModDevGradle 插件版本（2.0.x 系列，适配 Gradle 8.9+）
moddevgradle_version=2.0.141
java_version=21
